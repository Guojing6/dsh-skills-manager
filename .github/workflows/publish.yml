name: 发布 GitHub Release

# 本仓库通过 Git 分发，不发布 npm 包：推送 v* 标签时先做完整验证，
# 再按标签创建或更新 GitHub Release，说明由脚本从双语 CHANGELOG 生成。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      full: true

  release-notes:
    needs: check
    uses: ./.github/workflows/release.yml